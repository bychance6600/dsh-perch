<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" width="1400" height="1040" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f5f1e9"/>
    </linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1f2937" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1400" height="1040" fill="url(#bg2)"/>

  <text x="64" y="82" font-size="40" font-weight="700" fill="#111827">记忆的两层</text>
  <text x="64" y="120" font-size="18" fill="#4b5563">账本只记发生过什么；记忆是每次醒来重放出来的理解。</text>
  <text x="64" y="146" font-size="14" fill="#9ca3af">上半是账，中间是重放，下半是算出来的东西；右侧是两条翻旧事的路。</text>
  <line x1="64" y1="170" x2="1336" y2="170" stroke="#e5e7eb"/>

  <!-- 上：账 -->
  <rect x="64" y="192" width="800" height="188" rx="16" fill="#ffffff" stroke="#e5e7eb" filter="url(#soft2)"/>
  <text x="88" y="226" font-size="17" font-weight="700" fill="#0f766e">账：events.jsonl</text>
  <text x="844" y="226" text-anchor="end" font-size="12" fill="#b45309">只追加 · 不删 · 不改 · 不重排</text>

  <g font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#4b5563">
    <text x="88" y="256">0001  {"type":"heard","text":"你回来了"}</text>
    <text x="88" y="282">0002  {"type":"utterance","text":"我想先听你说"}</text>
    <text x="88" y="308">0003  {"type":"belief","text":"等待不是浪费时间"}</text>
    <text x="88" y="334">0004  {"type":"revise","ref":"0002","text":"我也可以先开口"}</text>
    <text x="88" y="360">0005  {"type":"heard","text":"今天有点累"}</text>
  </g>
  <text x="88" y="378" font-size="11.5" fill="#9ca3af" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">一行一条；时间只往前走，旧行不会被覆盖。</text>

  <path d="M464 380 V 404" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#a3)" opacity="0.7"/>

  <!-- 中：重放 -->
  <rect x="64" y="410" width="800" height="126" rx="16" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="88" y="444" font-size="17" font-weight="700" fill="#0f766e">重放：每次醒来都从头算</text>
  <text x="88" y="472" font-size="12.5" fill="#0f766e">读全量账本 → 重算派生 → 只把这一次要用的摆到眼前</text>
  <text x="88" y="502" font-size="11.5" fill="#0f766e">没有一个「记忆库」需要维护；账本在，理解就能重算。</text>

  <path d="M464 536 V 574" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#a3)" opacity="0.7"/>

  <!-- 下：重放出来的东西 -->
  <rect x="64" y="580" width="800" height="218" rx="16" fill="#ffffff" stroke="#e5e7eb" filter="url(#soft2)"/>
  <text x="88" y="614" font-size="17" font-weight="700" fill="#0f766e">重放出来的东西</text>
  <text x="844" y="614" text-anchor="end" font-size="12" fill="#9ca3af">不是另存一份，是从账上现算的</text>

  <g>
    <rect x="88" y="634" width="344" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="104" y="658" font-size="13.5" font-weight="700" fill="#1f2937">阶段</text>
    <text x="104" y="682" font-size="11.5" fill="#6b7280">按天推进；瓶颈看行为，不看说了什么</text>

    <rect x="456" y="634" width="384" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="472" y="658" font-size="13.5" font-weight="700" fill="#1f2937">判断</text>
    <text x="472" y="682" font-size="11.5" fill="#6b7280">beliefs；能被推翻，也能和别的判断打架</text>

    <rect x="88" y="712" width="344" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="104" y="736" font-size="13.5" font-weight="700" fill="#1f2937">印象</text>
    <text x="104" y="760" font-size="11.5" fill="#6b7280">她记得谁、和谁怎么相处</text>

    <rect x="456" y="712" width="384" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="472" y="736" font-size="13.5" font-weight="700" fill="#1f2937">立场</text>
    <text x="472" y="760" font-size="11.5" fill="#6b7280">四个阶段之后才出现；不参与折叠</text>
  </g>

  <!-- 右：两条检索路 -->
  <rect x="896" y="192" width="440" height="606" rx="16" fill="#fffbf5" stroke="#fde68a" filter="url(#soft2)"/>
  <text x="920" y="226" font-size="17" font-weight="700" fill="#b45309">翻旧事的两条路</text>
  <text x="920" y="250" font-size="12" fill="#a16207">读的是同一本账，只是排序不同</text>

  <path d="M864 690 H 888" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#a2)" opacity="0.6"/>

  <g>
    <rect x="920" y="272" width="392" height="220" rx="12" fill="#ffffff" stroke="#fde68a"/>
    <text x="940" y="306" font-size="18" font-weight="700" fill="#92400e">字面（默认）</text>
    <text x="940" y="334" font-size="12.5" fill="#78350f">按词面匹配：说了什么，就找什么。</text>
    <text x="940" y="360" font-size="12.5" fill="#78350f">不猜同义词，也不替她补话。</text>
    <text x="940" y="398" font-size="11.5" fill="#b45309">适合：她记得原话，只是找不到放在哪。</text>
    <text x="940" y="424" font-size="11.5" fill="#b45309">账不变；换的只是这一次的排序。</text>

    <rect x="920" y="516" width="392" height="250" rx="12" fill="#ffffff" stroke="#fde68a"/>
    <text x="940" y="550" font-size="18" font-weight="700" fill="#92400e">加权</text>
    <text x="940" y="578" font-size="12.5" fill="#78350f">同义词、被纠正过的、只提过一次的，</text>
    <text x="940" y="602" font-size="12.5" fill="#78350f">都会改变排序。</text>
    <text x="940" y="640" font-size="11.5" fill="#b45309">适合：原话想不起来，只记得大概意思。</text>
    <text x="940" y="666" font-size="11.5" fill="#b45309">不是另一份记忆，是同一本账的另一种翻法。</text>
    <text x="940" y="706" font-size="12" fill="#92400e">账不变，变的只是翻法。</text>
  </g>

  <!-- 底部两块 -->
  <rect x="64" y="836" width="612" height="126" rx="14" fill="#ffffff" stroke="#e5e7eb" filter="url(#soft2)"/>
  <text x="88" y="872" font-size="18" font-weight="700" fill="#0f766e">折叠 ≠ 删除</text>
  <text x="88" y="900" font-size="12.5" fill="#4b5563">折成一行「记不清原话了」；疤那一类永不折。</text>
  <text x="88" y="924" font-size="12.5" fill="#4b5563">原文一直在，她自己能翻回去。</text>
  <text x="88" y="948" font-size="11.5" fill="#9ca3af">折叠只是这一次没摆到眼前。</text>

  <rect x="724" y="836" width="612" height="126" rx="14" fill="#ffffff" stroke="#e5e7eb" filter="url(#soft2)"/>
  <text x="748" y="872" font-size="18" font-weight="700" fill="#0f766e">丢了重放就回来</text>
  <text x="748" y="900" font-size="12.5" fill="#4b5563">索引、缓存、快照都不是第二份真相。</text>
  <text x="748" y="924" font-size="12.5" fill="#4b5563">删了重算一遍，账还在。</text>
  <text x="748" y="948" font-size="11.5" fill="#9ca3af">能重建的东西，就不该被当成证据。</text>

  <text x="64" y="1004" font-size="12" fill="#9ca3af">理论出处：显著性 ← Cowan 工作记忆容量（约 4 个组块）；线索依赖遗忘 ← Tulving；遗忘的适应功能 ← Bjork；重构 ← Bartlett；矛盾 ← Festinger 认知失调。</text>
</svg>
