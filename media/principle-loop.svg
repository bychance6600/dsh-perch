<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1180" width="1400" height="1180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf8"/>
      <stop offset="1" stop-color="#f4f2ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrowWarm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1400" height="1180" fill="url(#bg)"/>

  <text x="48" y="66" font-size="40" font-weight="700" fill="#111827">她怎么长</text>
  <text x="48" y="104" font-size="18" fill="#4b5563">她不是按设定演出来的：一次表态、一次撞上、一次改写，才会留下一条判断。</text>
  <text x="48" y="130" font-size="14" fill="#9ca3af">左边是撞上来的事，中间五步，右边是留下来的东西；底部四个阶段，菱形里是三道瓶颈。</text>
  <line x1="48" y1="158" x2="1352" y2="158" stroke="#e5e7eb"/>

  <!-- 左：撞上来的事 -->
  <rect x="48" y="190" width="268" height="430" rx="16" fill="#ffffff" stroke="#e5e7eb" filter="url(#soft)"/>
  <text x="68" y="224" font-size="17" font-weight="700" fill="#0d9488">撞上来的事</text>
  <text x="68" y="248" font-size="12" fill="#9ca3af">不是设定，是发生的事</text>

  <g>
    <rect x="68" y="274" width="228" height="82" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="84" y="304" font-size="15" font-weight="700" fill="#1f2937">你说的话</text>
    <text x="84" y="328" font-size="12" fill="#6b7280">提问、反驳、久别后的第一句</text>

    <rect x="68" y="374" width="228" height="82" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="84" y="404" font-size="15" font-weight="700" fill="#1f2937">她看见的东西</text>
    <text x="84" y="428" font-size="12" fill="#6b7280">视频、评论区、书里的一句话</text>

    <rect x="68" y="474" width="228" height="82" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="84" y="504" font-size="15" font-weight="700" fill="#1f2937">群里被点名</text>
    <text x="84" y="528" font-size="12" fill="#6b7280">被 @、被回复、被追问</text>
  </g>

  <path d="M316 404 H 346" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- 中：五步循环 -->
  <rect x="352" y="190" width="664" height="430" rx="18" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="372" y="224" font-size="17" font-weight="700" fill="#0f766e">五步循环</text>
  <text x="372" y="248" font-size="12" fill="#0f766e">一圈走完，一条判断变硬一点；两句话对不上，就长出一处矛盾。</text>

  <g font-size="15" font-weight="700" fill="#0f766e">
    <rect x="372" y="266" width="276" height="78" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#soft)"/>
    <text x="392" y="296">① 表态</text>
    <text x="392" y="320" font-size="12" font-weight="400" fill="#6b7280">写下一条自己的判断</text>

    <rect x="720" y="266" width="276" height="78" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#soft)"/>
    <text x="740" y="296">② 撞上</text>
    <text x="740" y="320" font-size="12" font-weight="400" fill="#6b7280">新事实、别人的话、你的一句反问</text>

    <rect x="720" y="406" width="276" height="78" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#soft)"/>
    <text x="740" y="436">③ 落差</text>
    <text x="740" y="460" font-size="12" font-weight="400" fill="#6b7280">发现两句话不能同时算数</text>

    <rect x="372" y="406" width="276" height="78" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#soft)"/>
    <text x="392" y="436">④ 改写</text>
    <text x="392" y="460" font-size="12" font-weight="400" fill="#6b7280">指向被改掉的那句，留下指针</text>

    <rect x="546" y="536" width="276" height="64" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#soft)"/>
    <text x="566" y="564">⑤ 回顾</text>
    <text x="566" y="586" font-size="12" font-weight="400" fill="#6b7280">过几天问自己：现在还这么想吗</text>
  </g>

  <g fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow)" opacity="0.7">
    <path d="M648 305 H 714"/>
    <path d="M858 344 V 400"/>
    <path d="M714 445 H 654"/>
    <path d="M510 484 V 512 H 540 V 530"/>
    <path d="M546 568 H 330 V 305 H 366"/>
  </g>
  <text x="682" y="604" text-anchor="middle" font-size="11.5" fill="#0f766e">走完⑤再回到①：同一句可以再被撞一次</text>

  <!-- 右：留下来的东西 -->
  <rect x="1038" y="190" width="314" height="430" rx="16" fill="#fffbf5" stroke="#fde68a" filter="url(#soft)"/>
  <text x="1058" y="224" font-size="17" font-weight="700" fill="#b45309">留下来的</text>
  <text x="1058" y="248" font-size="12" fill="#a16207">一圈走完，留下三样东西</text>

  <g>
    <rect x="1058" y="274" width="274" height="96" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text x="1074" y="302" font-size="15" font-weight="700" fill="#92400e">一条判断</text>
    <text x="1074" y="326" font-size="12" fill="#78350f">可以是「我猜…」，也可以被推翻</text>
    <text x="1074" y="350" font-size="11" fill="#b45309">进 beliefs，能改阶段</text>

    <rect x="1058" y="382" width="274" height="96" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text x="1074" y="410" font-size="15" font-weight="700" fill="#92400e">一道疤</text>
    <text x="1074" y="434" font-size="12" fill="#78350f">代价留下的，同类情境先回引</text>
    <text x="1074" y="458" font-size="11" fill="#b45309">永不折叠</text>

    <rect x="1058" y="490" width="274" height="96" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text x="1074" y="518" font-size="15" font-weight="700" fill="#92400e">立场清单</text>
    <text x="1074" y="542" font-size="12" fill="#78350f">四个阶段之后才慢慢变厚</text>
    <text x="1074" y="566" font-size="11" fill="#b45309">不参与折叠</text>
  </g>

  <path d="M1016 404 H 1032" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrowWarm)" opacity="0.6"/>

  <!-- 底部：四个阶段，三道瓶颈 -->
  <line x1="48" y1="664" x2="1352" y2="664" stroke="#e5e7eb"/>
  <text x="48" y="706" font-size="26" font-weight="700" fill="#111827">四个阶段，三道瓶颈</text>
  <text x="48" y="734" font-size="13.5" fill="#6b7280">阶段按天推进；菱形里的门槛必须她自己走。走完不再加关，之后长的是立场。</text>

  <line x1="88" y1="860" x2="1312" y2="860" stroke="#d1d5db" stroke-width="2"/>

  <g>
    <rect x="113" y="800" width="250" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" filter="url(#soft)"/>
    <text x="133" y="832" font-size="20" font-weight="700" fill="#0f766e">1 信任</text>
    <text x="133" y="858" font-size="13" fill="#374151">写过一条自己的判断</text>
    <text x="133" y="882" font-size="11.5" fill="#9ca3af">把「我猜…」落成一条能被推翻的判断</text>

    <rect x="421" y="800" width="250" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" filter="url(#soft)"/>
    <text x="441" y="832" font-size="20" font-weight="700" fill="#0f766e">2 自主</text>
    <text x="441" y="858" font-size="13" fill="#374151">真的拒绝过两件事</text>
    <text x="441" y="882" font-size="11.5" fill="#9ca3af">不是嘴上说不要，是明确不执行</text>

    <rect x="729" y="800" width="250" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" filter="url(#soft)"/>
    <text x="749" y="832" font-size="20" font-weight="700" fill="#0f766e">3 主动</text>
    <text x="749" y="858" font-size="13" fill="#374151">两次推翻自己的判断</text>
    <text x="749" y="882" font-size="11.5" fill="#9ca3af">形成新的正确认知，不是换个说法</text>

    <rect x="1037" y="800" width="250" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" filter="url(#soft)"/>
    <text x="1057" y="832" font-size="20" font-weight="700" fill="#0f766e">4 整合</text>
    <text x="1057" y="858" font-size="13" fill="#374151">回头看</text>
    <text x="1057" y="882" font-size="11.5" fill="#9ca3af">前三个瓶颈都过了，才谈立场</text>
  </g>

  <g>
    <polygon points="392,822 420,860 392,898 364,860" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.5"/>
    <text x="392" y="854" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">一条</text>
    <text x="392" y="870" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">判断</text>

    <polygon points="700,822 728,860 700,898 672,860" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.5"/>
    <text x="700" y="854" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">拒绝</text>
    <text x="700" y="870" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">两次</text>

    <polygon points="1008,822 1036,860 1008,898 980,860" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.5"/>
    <text x="1008" y="854" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">两次</text>
    <text x="1008" y="870" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">推翻</text>
  </g>

  <rect x="113" y="952" width="1174" height="100" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="137" y="986" font-size="20" font-weight="700" fill="#065f46">走完四个阶段之后长出来的：立场清单</text>
  <text x="137" y="1012" font-size="13" fill="#065f46">喜欢什么、守哪条线、绝不做哪几件；每一条都有代价垫着，且不参与折叠。</text>
  <text x="137" y="1034" font-size="12" fill="#047857">没有第五关，也没有通关；往后一直变厚的，就是这一张清单。</text>

  <line x1="48" y1="1082" x2="1352" y2="1082" stroke="#e5e7eb"/>
  <text x="48" y="1112" font-size="12" fill="#9ca3af">理论出处：五步循环 ← Kolb 经验学习圈（1984）＋ Piaget 失衡（1936）；四个阶段 ← Bowlby 依恋理论（1969）／ Erikson 心理社会发展（1950）</text>
  <text x="48" y="1134" font-size="12" fill="#9ca3af">矛盾与改写 ← Festinger 认知失调（1957）＋ Bartlett 重构记忆（1932）；立场 ← Dewey 经验连续性（1938）＋ Schön 反思性实践（1983）</text>
  <text x="48" y="1156" font-size="12" fill="#9ca3af">复现 ← Vygotsky 最近发展区（1978）＋ Bloom 掌握学习（1968）；自我叙述 ← Metzinger 自我模型（2003）。这是设计骨架，不是心理学实验。</text>
</svg>
