name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # 这个项目零依赖，没有 install 步骤——少一步就少一处会因为 lockfile 漂移而失败。
      - name: 确认零依赖
        run: node -e "const p=require('./package.json');for(const k of ['dependencies','devDependencies','peerDependencies'])if(p[k]&&Object.keys(p[k]).length)throw new Error(k+' 不是空的');console.log('零依赖 OK')"

      - name: 跑测试
        shell: bash
        run: |
          set -o pipefail
          if npm test 2>&1 | tee test.log; then
            exit 0
          fi
          # 日志要登录才能看；把失败的用例名做成注解，公开页也能读到。
          grep -E '^✖' test.log | head -40 | while IFS= read -r line; do
            echo "::error title=CI 测试失败::$line"
          done
          exit 1

      # 预算（AGENTS §19）：重放随条数超线性增长过一次，肉眼看不出，只有量才知道。
      # 这里只量到 1 万条——5 万条那条要 --big，几十秒，放本地。
      - name: 跑预算（1 万条重放 < 700ms）
        run: node tools/bench.mjs

  # Windows 单独跑一轮：路径归一化、chmod 语义、ffmpeg 探测在这边和 Linux 不一样，
  # 而这些正是这个插件最容易出问题的地方。
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 跑测试
        shell: bash
        run: |
          set -o pipefail
          if npm test 2>&1 | tee test.log; then
            exit 0
          fi
          # 日志要登录才能看；把失败的用例名做成注解，公开页也能读到。
          grep -E '^✖' test.log | head -40 | while IFS= read -r line; do
            echo "::error title=CI 测试失败::$line"
          done
          exit 1
